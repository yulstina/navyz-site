<body class="forgot-body">
  <div class="forgot-box">
    <div class="card">
      <div class="logo">
        <img src="assets/images/navyz-logo.png" alt="Logo">
      </div>
      <div class="no-logo-box">
        <strong> Reset Password </strong>
        <p> Can't receive email or not yet have an email registered with us? Contact NAVYZ support. </p>
        <form>  
          <div class="email-input">
            <label for="email">Email</label>
            <input type="text" name="email" placeholder="Email Address" class="input__inner">
          </div>
          <button class="btn" type="button"><span> Continue </span></button> 
        </form>

        <a href="login.html" class="btn go-login">Go to Login</a>
      </div>
    </div>
    <div class="contact-email">
      <span>Support Email：</span>
      <a href="mailto:support@navyz.com">support@navyz.com</a>
    </div>
  </div>
