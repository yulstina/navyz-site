<!doctype html>
<html lang="ko">
<head>
   <meta charset="utf-8">
   <meta name="viewport" content="width=device-width, initial-scale=1"> 

  <!-- Google Fonts: Noto Sans KR, Roboto -->
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <script src="https://kit.fontawesome.com/aabd5cc9c3.js" crossorigin="anonymous"></script>

  <!-- 스와이퍼 -->
  <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/swiper@12/swiper-bundle.min.css"/>

    <!-- Bootstrap GRID only (safe import) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap-grid.min.css"> 
  <link rel="stylesheet" href="assets/css/util.css">
  <link rel="stylesheet" href="assets/css/style.css">
  <title> NAVYZ</title>
  <style>
  
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-wrapper">
      <div class="login-card">
        <div class="login-header">
          <a href="index.html"> <img src="assets/images/navyz-logo2x.png" alt="Logo"></a>
           <h2>Login to Your Account</h2>
        </div>
        <div class="login-form">
          <form action="#" method="post">
            <div class="form-group">
              <label for="email">Email</label>
              <input type="text" name="email" placeholder="Email Address" class="input__inner">
            </div>
            <div class="form-group">
              <label for="password">Password</label>
              <input type="password" id="password" name="password" placeholder="Password" class="input__inner" required>
            </div>
            <button type="submit"> Log In </button>
            
            <div class="bottom">
              <label class="checkbox remember">
                <span class="checkbox__input">
                  <span class="checkbox__inner"></span>
                  <input type="checkbox" aria-hidden="false" class="checkbox__original" value="">
                </span>
                <span class="checkbox__label">Remember me</span>
              </label>
              <a href="forgot-password.html" class="forgot">Forgot Password?</a>
            </div>

          </form>
        </div>
      </div>
      <div class="no-user">
        <p><a href="contact.html"> Don't have an account? Sign Up</a></p>
      </div>
    </div>
  </div>
 
<script>
$(function(){
  // =============================
  // Header height sync (CSS var)
  // =============================
  function syncHeader(){ var h = $('.nav').outerHeight()||68; document.documentElement.style.setProperty('--header-h', h + 'px'); }
  syncHeader(); $(window).on('resize', syncHeader);

  // =============================
  // Header scroll effect
  // =============================
  function checkScrolled() {
    var scrollTop = $(window).scrollTop();
    if (scrollTop > 100) {
      $('header').addClass('scrolled');
    } else {
      $('header').removeClass('scrolled');
    }
  }
  
  // 페이지 로드 시 스크롤 위치 확인
  checkScrolled();
  
  // 스크롤 이벤트 리스너
  $(window).on('scroll', checkScrolled);

  // =============================
  // All Menu Toggle
  // =============================
  $('.all-menu-icon').on('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    console.log('All menu icon clicked');
    var $menuList = $('.all-menu-list');
    $menuList.toggleClass('open');
    console.log('Menu open state:', $menuList.hasClass('open'));
  });

  // 외부 클릭 시 all-menu-list 숨기기
  $(document).on('click', function(e) {
    if (!$(e.target).closest('.nav-all-menu').length) {
      $('.all-menu-list').removeClass('open');
      console.log('Menu closed by outside click');
    }
  });

  // ESC 키로 all-menu-list 숨기기
  $(document).on('keydown', function(e) {
    if (e.key === 'Escape') {
      $('.all-menu-list').removeClass('open');
      console.log('Menu closed by ESC key');
    }
  });

  // =============================
  // Mega menu (jQuery toggle)
  // =============================
  var $btns = $('.menu-btn');
  var $panes = $('.mega');
  function closeAll(){ $panes.removeClass('open'); $btns.attr('aria-expanded','false'); }
  $btns.on('click', function(e){
    e.preventDefault();
    var $b=$(this); var id=$b.attr('aria-controls'); var $pane=$('#'+id);
    var isOpen = $b.attr('aria-expanded')==='true';
    if(isOpen){ closeAll(); }
    else{ closeAll(); $pane.addClass('open'); $b.attr('aria-expanded','true'); }
  });
  $(document).on('click', function(e){ if($(e.target).closest('header,.mega').length===0){ closeAll(); }});
  $(document).on('keydown', function(e){ if(e.key==='Escape'){ closeAll(); }});
});
</script>
</body>
</html>
